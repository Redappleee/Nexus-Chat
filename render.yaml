services:
  - type: web
    name: nexus-chat-api
    env: node
    buildCommand: npm install && npm run build -w @nexus/shared && npm run build -w @nexus/server
    startCommand: npm run start -w @nexus/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
